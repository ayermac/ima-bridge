<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" fill-rule="evenodd">
    <!-- sweat drop -->
    <path d="M86 28 Q92 34 88 40 Q84 44 82 38 Q80 32 86 28" fill="#60a5fa" opacity="0.7"/>
    <!-- body -->
    <rect x="32" y="46" width="56" height="50" rx="26" fill="#dc2626"/>
    <!-- head -->
    <circle cx="60" cy="48" r="26" fill="#dc2626"/>
    <!-- ears (slightly droopy) -->
    <ellipse cx="40" cy="34" rx="9" ry="13" fill="#dc2626" transform="rotate(-35 40 34)"/>
    <ellipse cx="80" cy="34" rx="9" ry="13" fill="#dc2626" transform="rotate(35 80 34)"/>
    <!-- face -->
    <circle cx="52" cy="45" r="5.5" fill="#ffffff"/>
    <circle cx="68" cy="45" r="5.5" fill="#ffffff"/>
    <circle cx="52" cy="46" r="3" fill="#111827"/>
    <circle cx="68" cy="46" r="3" fill="#111827"/>
    <!-- worried mouth -->
    <path d="M56 56 Q60 52 64 56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- blush -->
    <circle cx="44" cy="52" r="4" fill="#ffb3ba" opacity="0.45"/>
    <circle cx="76" cy="52" r="4" fill="#ffb3ba" opacity="0.45"/>
    <!-- paws -->
    <ellipse cx="42" cy="90" rx="10" ry="6" fill="#b91c1c"/>
    <ellipse cx="78" cy="90" rx="10" ry="6" fill="#b91c1c"/>
  </g>
</svg>
