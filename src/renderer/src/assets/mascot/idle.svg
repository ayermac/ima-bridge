<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" fill-rule="evenodd">
    <!-- body -->
    <rect x="32" y="46" width="56" height="50" rx="26" fill="#2563eb"/>
    <!-- head -->
    <circle cx="60" cy="48" r="26" fill="#2563eb"/>
    <!-- left ear -->
    <ellipse cx="40" cy="32" rx="9" ry="13" fill="#2563eb" transform="rotate(-22 40 32)"/>
    <!-- right ear -->
    <ellipse cx="80" cy="32" rx="9" ry="13" fill="#2563eb" transform="rotate(22 80 32)"/>
    <!-- face -->
    <circle cx="52" cy="45" r="5.5" fill="#ffffff"/>
    <circle cx="68" cy="45" r="5.5" fill="#ffffff"/>
    <circle cx="52" cy="46" r="3" fill="#111827"/>
    <circle cx="68" cy="46" r="3" fill="#111827"/>
    <!-- smile -->
    <path d="M55 54 Q60 58 65 54" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- blush -->
    <circle cx="44" cy="52" r="4" fill="#ffb3ba" opacity="0.45"/>
    <circle cx="76" cy="52" r="4" fill="#ffb3ba" opacity="0.45"/>
    <!-- paws -->
    <ellipse cx="42" cy="90" rx="10" ry="6" fill="#1d4ed8"/>
    <ellipse cx="78" cy="90" rx="10" ry="6" fill="#1d4ed8"/>
  </g>
